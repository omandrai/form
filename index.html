<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 600px;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .form-container h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .gender-options {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .gender-options label {
            font-weight: normal;
            margin: 0;
        }

        .gender-options input {
            width: auto;
            margin-right: 5px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn {
            background: #667eea;
            color: white;
        }

        .submit-btn:hover {
            background: #5568d8;
        }

        .reset-btn {
            background: #e0e0e0;
            color: #333;
        }

        .reset-btn:hover {
            background: #ccc;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .form-container {
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }

            .gender-options {
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h1>Student Registration</h1>

        <form>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input 
                    type="text" 
                    id="name" 
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input 
                    type="tel" 
                    id="phone" 
                    placeholder="Enter your phone number"
                    required
                >
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input 
                    type="date" 
                    id="dob"
                    required
                >
            </div>

            <div class="form-group">
                <label>Gender</label>

                <div class="gender-options">
                    <label>
                        <input type="radio" name="gender" value="male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="other">
                        Other
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="course">Select Course</label>

                <select id="course" required>
                    <option value="">-- Select Course --</option>
                    <option value="bca">BCA</option>
                    <option value="btech">B.Tech</option>
                    <option value="mca">MCA</option>
                    <option value="msc">M.Sc</option>
                    <option value="mba">MBA</option>
                </select>
            </div>

            <div class="form-group">
                <label for="address">Address</label>

                <textarea 
                    id="address" 
                    placeholder="Enter your address"
                    required
                ></textarea>
            </div>

            <div class="buttons">
                <button type="submit" class="submit-btn">
                    Submit
                </button>

                <button type="reset" class="reset-btn">
                    Reset
                </button>
            </div>

        </form>

    </div>

</body>
</html>
